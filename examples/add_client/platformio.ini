; Add RPC サンプル (client) / NUCLEO-F303K8
; robostep-libs-cpp (private) は lib_deps で .pio/libdeps に取得する。SSH 鍵で GitHub に接続できること。

[env:nucleo_f303k8]
platform = ststm32
board = nucleo_f303k8
framework = mbed
upload_protocol = mbed
lib_deps =
    symlink://../..
    git+ssh://git@github.com/ROBOSTEP-SHARE/robostep-libs-cpp.git#add-library-json
build_flags =
    -std=c++17
    -I../common
